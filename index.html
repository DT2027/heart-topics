<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>真心话题库 · 500 题</title>
<meta name="description" content="输入题号，抽取一道刚刚好的真心话题。500 道可聊 3 到 15 分钟的开放式问题。" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath d='M32 6 L52 26 L32 46 L12 26 Z' fill='%23fb7185'/%3E%3Cpath d='M32 6 L52 26 L32 46 Z' fill='%23a78bfa'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>

<div class="scene" aria-hidden="true">
  <div class="sky"></div>
  <div class="sun"><span class="sun-core"></span></div>

  <div class="cloud cloud-1"><i></i><i></i><i></i></div>
  <div class="cloud cloud-2"><i></i><i></i><i></i></div>
  <div class="cloud cloud-3"><i></i><i></i><i></i></div>
  <div class="cloud cloud-4"><i></i><i></i><i></i></div>

  <div class="kite-wrap">
    <svg class="kite" viewBox="0 0 120 150" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="kiteG" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#ff8fab" />
          <stop offset="55%" stop-color="#fb7185" />
          <stop offset="100%" stop-color="#a78bfa" />
        </linearGradient>
        <linearGradient id="tailG" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="#fde047" />
          <stop offset="100%" stop-color="#fb923c" />
        </linearGradient>
      </defs>
      <path d="M60 8 L112 62 L60 116 L8 62 Z" fill="url(#kiteG)" stroke="#ffffff" stroke-width="4" stroke-linejoin="round"/>
      <path d="M60 8 L60 116 M8 62 L112 62" stroke="#ffffff" stroke-width="3" opacity=".85" stroke-linecap="round"/>
      <path d="M60 116 q10 16 -4 26 q-12 9 -2 20" fill="none" stroke="url(#tailG)" stroke-width="3.5" stroke-linecap="round"/>
      <path d="M60 130 l-13 -7 l4 14 z" fill="#fde047"/>
      <path d="M58 152 l14 -6 l-5 13 z" fill="#fb923c"/>
    </svg>
    <div class="kite-string"></div>
  </div>

  <div class="birds">
    <span class="bird b1"></span>
    <span class="bird b2"></span>
    <span class="bird b3"></span>
  </div>

  <div class="hill hill-back"></div>
  <div class="hill hill-front"></div>
  <div class="flowers">
    <span style="--x:8%;--d:0s;--c:#f472b6"></span>
    <span style="--x:18%;--d:1.4s;--c:#fde047"></span>
    <span style="--x:29%;--d:.7s;--c:#fb7185"></span>
    <span style="--x:41%;--d:2.1s;--c:#a78bfa"></span>
    <span style="--x:54%;--d:.3s;--c:#fde047"></span>
    <span style="--x:66%;--d:1.8s;--c:#f472b6"></span>
    <span style="--x:77%;--d:1.1s;--c:#38bdf8"></span>
    <span style="--x:88%;--d:2.4s;--c:#fb923c"></span>
    <span style="--x:95%;--d:.9s;--c:#fde047"></span>
  </div>

  <div class="motes">
    <span style="--x:12%;--s:11px;--d:0s;--t:17s"></span>
    <span style="--x:27%;--s:8px;--d:2.5s;--t:21s"></span>
    <span style="--x:44%;--s:13px;--d:1.2s;--t:19s"></span>
    <span style="--x:61%;--s:9px;--d:3.4s;--t:23s"></span>
    <span style="--x:78%;--s:12px;--d:.6s;--t:16s"></span>
    <span style="--x:91%;--s:8px;--d:4.1s;--t:25s"></span>
  </div>
</div>

<main class="wrap">
  <section class="panel">

    <header class="head">
      <div class="badge-row">
        <span class="badge b-rose">破冰</span>
        <span class="badge b-amber">进阶</span>
        <span class="badge b-violet">亲密</span>
        <span class="badge b-teal">自省</span>
        <span class="badge b-blue">深度</span>
      </div>
      <h1>真心话题库</h1>
      <p class="sub">500 道不设标准答案的话题 · 输入题号，抽一个此刻想聊的</p>
    </header>

    <form id="ask-form" class="ask" autocomplete="off">
      <div class="field">
        <input id="num-input" type="number" inputmode="numeric" min="1" max="500" step="1"
               placeholder="输入题号 1 - 500" aria-label="题号" />
        <button type="submit" class="btn-primary">确定</button>
      </div>
      <button type="button" id="random-btn" class="btn-ghost">🎲 随机来一题</button>
      <p id="error" class="error" role="alert" hidden></p>
    </form>

    <section id="question-card" class="q-card" hidden aria-live="polite">
      <div class="q-top">
        <span id="q-no" class="q-no">第 1 题</span>
        <span id="q-level" class="q-level">破冰</span>
      </div>
      <p id="q-text" class="q-text"></p>
      <div class="q-foot">
        <button type="button" id="prev-btn" class="btn-mini">← 上一题</button>
        <button type="button" id="next-btn" class="btn-mini">下一题 →</button>
        <button type="button" id="copy-btn" class="btn-mini">复制</button>
      </div>
      <p class="q-tip">不用急着给答案，慢慢聊就好。</p>
    </section>

    <section class="history">
      <div class="hist-head">
        <h2>已浏览题号 <span id="hist-count" class="count">0</span></h2>
        <button type="button" id="clear-btn" class="link-btn">清空</button>
      </div>
      <div id="history-list" class="chips"></div>
      <p id="history-empty" class="empty">还没有记录，输入一个题号试试。</p>
    </section>

    <footer class="foot">
      <p>共 500 题 · 题目不涉及隐私，安全可聊</p>
    </footer>

  </section>
</main>

<script src="questions.js"></script>
<script src="app.js"></script>
</body>
</html>
